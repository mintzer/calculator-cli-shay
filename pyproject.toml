[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator-cli"
version = "0.1.0"
description = "A very simple CLI calculator"
requires-python = ">=3.13"

[tool.setuptools]
py-modules = ["calculator"]

[project.scripts]
calc = "calculator:main"
