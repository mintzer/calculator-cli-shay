[project]
name = "calculator-cli"
version = "0.1.0"
description = "A very simple CLI calculator"
requires-python = ">=3.12"

[project.scripts]
calc = "calculator:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calculator.py"]
